<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <!-- Background glow gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f261c" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    <!-- Window shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#03e28e" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="14" fill="url(#bgGlow)" />

  <!-- IDE Window -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="920" height="560" rx="10" fill="#0a0a0a" stroke="#03e28e" stroke-opacity="0.35" stroke-width="1.2" />

    <!-- Title Bar -->
    <rect width="920" height="36" rx="10" fill="#0a0a0a" />
    <rect y="26" width="920" height="10" fill="#0a0a0a" />
    <line x1="0" y1="36" x2="920" y2="36" stroke="#03e28e" stroke-opacity="0.25" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
    <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
    <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

    <!-- Command Center -->
    <rect x="290" y="7" width="340" height="22" rx="5" fill="#111111" stroke="#03e28e" stroke-opacity="0.3" stroke-width="1" />
    <text x="460" y="22" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">
      willow-theme &mdash; <tspan fill="#03e28e" font-weight="600">Visual Studio Code</tspan>
    </text>

    <!-- Activity Bar -->
    <rect x="0" y="36" width="46" height="498" fill="#0a0a0a" />
    <line x1="46" y1="36" x2="46" y2="534" stroke="#03e28e" stroke-opacity="0.2" stroke-width="1" />

    <!-- Activity Bar Active Pill -->
    <rect x="0" y="48" width="3" height="22" rx="1.5" fill="#03e28e" />

    <!-- Activity Bar Icons -->
    <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Explorer Active -->
      <path d="M16 53 H29 V67 H16 Z M16 58 H29" stroke="#03e28e" />
      <!-- Search -->
      <path d="M21 88 A4 4 0 1 0 21 80 A4 4 0 1 0 21 88 M24 86 L28 90" stroke="#ffffff" stroke-opacity="0.4" />
      <!-- Source Control -->
      <path d="M19 110 A2 2 0 1 0 19 106 A2 2 0 1 0 19 110 M26 120 A2 2 0 1 0 26 116 A2 2 0 1 0 26 120 M19 110 V122 M26 116 C26 113 19 113 19 113" stroke="#ffffff" stroke-opacity="0.4" />
      <!-- Extensions -->
      <path d="M17 142 H21 V146 H17 Z M23 142 H27 V146 H23 Z M20 136 H24 V140 H20 Z" stroke="#ffffff" stroke-opacity="0.4" />
    </g>

    <!-- Side Bar -->
    <rect x="46" y="36" width="170" height="498" fill="#0a0a0a" />
    <line x1="216" y1="36" x2="216" y2="534" stroke="#03e28e" stroke-width="1" />

    <!-- Side Bar Title -->
    <text x="60" y="56" fill="#9f9f9fb3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">EXPLORER: WILLOW</text>

    <!-- Tree Items -->
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5">
      <text x="60" y="78" fill="#03e28eb3" font-weight="600">&#9662; src</text>
      <!-- Active File Item -->
      <rect x="46" y="86" width="170" height="22" fill="#2f604d" />
      <text x="74" y="101" fill="#468dc7" font-weight="600">TS</text>
      <text x="94" y="101" fill="#ffffff" font-weight="500">app.ts</text>

      <text x="74" y="123" fill="#82dcff" font-weight="600">TS</text>
      <text x="94" y="123" fill="#cccccc">theme.ts</text>

      <text x="60" y="145" fill="#03e28eb3" font-weight="600">&#9656; themes</text>
      <text x="60" y="167" fill="#e5c07b">{} package.json</text>
      <text x="60" y="189" fill="#82dcff">M&#8595; README.md</text>
      <text x="60" y="211" fill="#82dcff">M&#8595; CHANGELOG.md</text>
    </g>

    <!-- Editor Area -->
    <g transform="translate(216, 36)">
      <!-- Tab Bar -->
      <rect width="704" height="32" fill="#0a0a0a" />
      <line x1="0" y1="32" x2="704" y2="32" stroke="#03e28e" stroke-width="1" />

      <!-- Active Tab: app.ts -->
      <rect x="0" y="0" width="140" height="32" fill="#111111" />
      <line x1="0" y1="0" x2="140" y2="0" stroke="#03e28e" stroke-width="2.5" />
      <line x1="140" y1="0" x2="140" y2="32" stroke="#1c1c1c" stroke-width="1" />
      <text x="14" y="20" fill="#468dc7" font-family="Consolas, monospace" font-size="11" font-weight="700">TS</text>
      <text x="36" y="20" fill="#03e28e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="500">app.ts</text>
      <circle cx="124" cy="16" r="3" fill="#82dcff" />

      <!-- Inactive Tab: willow-color-theme.json -->
      <rect x="140" y="0" width="180" height="32" fill="#000000" />
      <line x1="320" y1="0" x2="320" y2="32" stroke="#1c1c1c" stroke-width="1" />
      <text x="154" y="20" fill="#e5c07b" font-family="Consolas, monospace" font-size="11" font-weight="700">{}</text>
      <text x="174" y="20" fill="#ffffffa0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5">willow-color-theme.json</text>

      <!-- Code Editor Body -->
      <g transform="translate(0, 32)">
        <rect width="704" height="466" fill="#0a0a0a" />

        <!-- Line Numbers -->
        <g fill="#858585" font-family="Consolas, Fira Code, monospace" font-size="12" text-anchor="end">
          <text x="36" y="26">1</text>
          <text x="36" y="46">2</text>
          <text x="36" y="66">3</text>
          <text x="36" y="86">4</text>
          <text x="36" y="106">5</text>
          <text x="36" y="126">6</text>
          <text x="36" y="146">7</text>
          <text x="36" y="166">8</text>
          <text x="36" y="186">9</text>
          <text x="36" y="206">10</text>
          <text x="36" y="226">11</text>
          <text x="36" y="246">12</text>
          <text x="36" y="266">13</text>
          <text x="36" y="286">14</text>
          <text x="36" y="306">15</text>
          <text x="36" y="326">16</text>
          <text x="36" y="346">17</text>
          <text x="36" y="366">18</text>
          <text x="36" y="386">19</text>
          <text x="36" y="406">20</text>
        </g>

        <!-- Current Line Highlight -->
        <rect x="48" y="274" width="656" height="19" fill="#03e28e" fill-opacity="0.06" stroke="#282828" stroke-width="1" />

        <!-- Code Content -->
        <g transform="translate(56, 0)" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12.5" xml:space="preserve">
          <!-- Line 1: Comment -->
          <text y="26" fill="#676f7d" font-style="italic">// Willow Theme &mdash; vivid dark theme with green, turquoise &amp; purple accents</text>

          <!-- Line 2: Import -->
          <text y="46">
            <tspan fill="#e5c07b">import</tspan>
            <tspan fill="#03e28e" font-weight="bold"> { </tspan>
            <tspan fill="#e5c07b">ThemeEngine</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#e5c07b">Palette</tspan>
            <tspan fill="#03e28e" font-weight="bold"> } </tspan>
            <tspan fill="#e5c07b">from</tspan>
            <tspan fill="#81b88b"> '@willow/core'</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>

          <!-- Line 4: Decorator -->
          <text y="86">
            <tspan fill="#c678dd">@Theme</tspan><tspan fill="#03e28e" font-weight="bold">(</tspan><tspan fill="#82dcff" font-weight="bold">{ </tspan><tspan fill="#82dcff">name</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#81b88b">'Willow-Dark'</tspan><tspan fill="#82dcff" font-weight="bold"> }</tspan><tspan fill="#03e28e" font-weight="bold">)</tspan>
          </text>

          <!-- Line 5: Class Declaration -->
          <text y="106">
            <tspan fill="#e5c07b">export class </tspan><tspan fill="#e5c07b">WillowThemeEngine </tspan><tspan fill="#03e28e" font-weight="bold">{</tspan>
          </text>

          <!-- Line 6: Properties -->
          <text y="126">
            <tspan fill="#d4d4d4">  </tspan><tspan fill="#e5c07b">public readonly </tspan><tspan fill="#82dcff">primaryGreen</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#e5c07b">string </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#81b88b">'#03e28e'</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>
          <text y="146">
            <tspan fill="#d4d4d4">  </tspan><tspan fill="#e5c07b">public readonly </tspan><tspan fill="#82dcff">turquoiseAccent</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#e5c07b">string </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#81b88b">'#82dcff'</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>
          <text y="166">
            <tspan fill="#d4d4d4">  </tspan><tspan fill="#e5c07b">public readonly </tspan><tspan fill="#82dcff">purpleAccent</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#e5c07b">string </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#81b88b">'#c678dd'</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>

          <!-- Line 9: Async Method -->
          <text y="206">
            <tspan fill="#d4d4d4">  </tspan><tspan fill="#e5c07b">public async </tspan><tspan fill="#468dc7">initialize</tspan><tspan fill="#82dcff" font-weight="bold">(</tspan><tspan fill="#d4d4d4">palette</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#e5c07b">Palette</tspan><tspan fill="#82dcff" font-weight="bold">)</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#e5c07b">Promise</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#e5c07b">boolean</tspan><tspan fill="#d4d4d4">&gt; </tspan><tspan fill="#82dcff" font-weight="bold">{</tspan>
          </text>

          <!-- Line 10: Method Body -->
          <text y="226">
            <tspan fill="#d4d4d4">    </tspan><tspan fill="#e5c07b">const </tspan><tspan fill="#d19a66">result </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#e5c07b">await </tspan><tspan fill="#d4d4d4">palette.</tspan><tspan fill="#468dc7">applyStyles</tspan><tspan fill="#c678dd" font-weight="bold">(</tspan><tspan fill="#e5c07b" font-weight="bold">{</tspan>
          </text>
          <text y="246">
            <tspan fill="#d4d4d4">      </tspan><tspan fill="#82dcff">bracketPairColorization</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#d19a66">true</tspan><tspan fill="#d4d4d4">,</tspan>
          </text>
          <text y="266">
            <tspan fill="#d4d4d4">      </tspan><tspan fill="#82dcff">stickyScrollEnabled</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#d19a66">true</tspan><tspan fill="#d4d4d4">,</tspan>
          </text>
          <!-- Line 14: Cursor Line -->
          <text y="286">
            <tspan fill="#d4d4d4">      </tspan><tspan fill="#82dcff">contrastRatio</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#d19a66">1.42</tspan>
          </text>
          <!-- Cursor Indicator -->
          <rect x="220" y="275" width="2" height="15" fill="#03e28e" />

          <text y="306">
            <tspan fill="#d4d4d4">    </tspan><tspan fill="#e5c07b" font-weight="bold">}</tspan><tspan fill="#c678dd" font-weight="bold">)</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>
          <text y="326">
            <tspan fill="#d4d4d4">    </tspan><tspan fill="#e5c07b">return </tspan><tspan fill="#d19a66">result</tspan><tspan fill="#d4d4d4">;</tspan>
          </text>
          <text y="346">
            <tspan fill="#d4d4d4">  </tspan><tspan fill="#82dcff" font-weight="bold">}</tspan>
          </text>
          <text y="366">
            <tspan fill="#03e28e" font-weight="bold">}</tspan>
          </text>
        </g>
      </g>
    </g>

    <!-- Status Bar -->
    <g transform="translate(0, 534)">
      <rect width="920" height="26" fill="#0a0a0a" />
      <line x1="0" y1="0" x2="920" y2="0" stroke="#70ffc9" stroke-width="1" />

      <!-- WSL Remote Badge -->
      <rect x="0" y="0" width="105" height="26" fill="#16825d" />
      <text x="52" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&#8862; WSL: Ubuntu</text>

      <!-- Status Left -->
      <text x="120" y="17" fill="#82dcff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">&#x2442; main*</text>
      <text x="175" y="17" fill="#82dcff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">&#x2713; 0 errors</text>

      <!-- Status Right -->
      <g fill="#82dcff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="end">
        <text x="760" y="17">Ln 14, Col 26</text>
        <text x="825" y="17">UTF-8</text>
        <text x="895" y="17">TypeScript</text>
        <circle cx="905" cy="13" r="3.5" fill="#03e28e" />
      </g>
    </g>
  </g>
</svg>
